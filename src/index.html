
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Zelda Pixel Adventure</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background: #101810;
            color: #ffffff;
            font-family: monospace;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            overflow-x: hidden;
        }

        h1 {
            color: #f5df8c;
            font-size: 24px;
            text-align: center;
            margin: 0;
        }

        #game {
            display: block;
            width: min(96vw, 1280px);
            height: auto;
            aspect-ratio: 16 / 9;
            background: #000000;
            border: 4px solid #c9a45b;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            outline: none;
        }

        .controls {
            text-align: center;
            line-height: 1.8;
            color: #dce5c8;
            font-size: 13px;
            padding: 0 12px;
        }

        .controls strong {
            color: #f5df8c;
        }
    </style>

</head>

<body>

    <h1>ZELDA PIXEL ADVENTURE</h1>

    <canvas
        id="game"
        width="320"
        height="180"
        tabindex="0"
    ></canvas>

    <div class="controls">
        <strong>WASD / SETAS</strong> — MOVIMENTAR
        <br>
        <strong>J</strong> — ATACAR |
        <strong>K</strong> — ESCUDO |
        <strong>Q</strong> — INVENTÁRIO
    </div>

    <script src="./js/world.js"></script>

    <script src="./js/player.js"></script>

    <script src="./js/combat.js"></script>

    <script src="./js/inventory.js"></script>

    <script src="./js/game.js"></script>

</body>

</html>
